name: "인사이트 새 글 발행"
description: "제목, 이미지, 본문만 입력하면 홈페이지에 자동 발행됩니다."
title: "[칼럼] 새 글 발행"
body:
  - type: markdown
    attributes:
      value: |
        # 새 글 작성

        **아래 항목만 작성하면 됩니다.**
        이미지는 원하는 칸에 **드래그앤드롭 또는 붙여넣기**하세요.

        ※ 위쪽 GitHub 제목은 수정하지 않아도 됩니다.

  - type: input
    id: title
    attributes:
      label: "글 제목"
      placeholder: "예: 강남울쎄라 가격 알아볼 때 고려할 점"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "카테고리"
      options:
        - 리프팅
        - 스킨부스터
        - 색소
        - 여드름
        - 톡신/필러
        - 제모
        - 바디
        - 피부관리
    validations:
      required: true

  - type: textarea
    id: thumbnail
    attributes:
      label: "대표 이미지"
      description: "이 칸에 대표 이미지를 드래그앤드롭하거나 Ctrl+V로 붙여넣으세요."
      placeholder: "여기에 대표 이미지 넣기"
    validations:
      required: false

  - type: input
    id: thumbnail_link
    attributes:
      label: "대표 이미지 클릭 링크"
      description: "대표 이미지 클릭 시 이동할 주소가 있으면 입력하세요. 없으면 비워두세요."
      placeholder: "https://www.idclinic.co.kr/"
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: "본문"
      description: "글을 자유롭게 작성하세요. 본문 중간에도 이미지를 바로 드래그앤드롭할 수 있습니다."
      placeholder: |
        여기에 본문을 작성하세요.

        이미지를 넣고 싶은 위치에 파일을 드래그앤드롭하면 됩니다.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        작성이 끝났으면 아래 **Create** 버튼만 눌러주세요.
