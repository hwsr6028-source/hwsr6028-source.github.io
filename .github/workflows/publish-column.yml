name: Publish FINE COLUMN from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  publish:
    if: contains(github.event.issue.body, '### 글 제목') || contains(github.event.issue.body, '### 제목')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create insight markdown
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import os, re, pathlib, datetime

          body = os.environ["ISSUE_BODY"]
          issue_no = os.environ["ISSUE_NUMBER"]

          def section(name):
              m = re.search(rf"### {re.escape(name)}\s*\n\s*(.*?)(?=\n### |\Z)", body, re.S)
              if not m:
                  return ""
              v = m.group(1).strip()
              return "" if v == "_No response_" else v

          title = section("글 제목") or section("제목")
          seo_title = section("검색 노출 제목") or section("SEO 제목") or title
          description = section("검색 노출 설명") or section("검색 설명")
          category = section("카테고리")
          thumbnail_md = section("대표 이미지")
          thumbnail_link = section("대표 이미지 클릭 링크")
          promo_title = section("상단 프로모션 제목")
          promo_price = section("상단 프로모션 가격")
          promo_link = section("가격/상담 버튼 링크")
          consult_link = section("상담 링크")
          phone = section("전화번호")
          booking_link = section("예약 링크")
          content = section("본문")

          if not description and content:
              plain = re.sub(r'<[^>]+>', ' ', content)
              plain = re.sub(r'!\\[[^\\]]*\\]\\([^)]*\\)', ' ', plain)
              plain = re.sub(r'https?://\\S+', ' ', plain)
              plain = re.sub(r'[#*_>~-]+', ' ', plain)
              plain = re.sub(r'\\s+', ' ', plain).strip()
              description = plain[:140] if plain else title

          thumbnail = ""
          if thumbnail_md:
              m = re.search(r'!\[[^\]]*\]\((https?://[^)]+)\)', thumbnail_md)
              if not m:
                  m = re.search(r'<img[^>]+src=["\'](https?://[^"\']+)["\']', thumbnail_md)
              if not m:
                  m = re.search(r'(https?://\S+)', thumbnail_md)
              if m:
                  thumbnail = m.group(1).strip()

          if not title or not category or not content:
              raise SystemExit("필수 입력값을 찾지 못했습니다.")

          # 제목을 그대로 활용한 한글 URL 슬러그
          # 예: "포텐자 모공 흉터 탄력 복합 RF 마이크로니들 가이드"
          #  -> "포텐자-모공-흉터-탄력-복합-rf-마이크로니들-가이드"
          slug = title.strip().lower()
          slug = re.sub(r"[^0-9a-z가-힣]+", "-", slug)
          slug = re.sub(r"-+", "-", slug).strip("-")
          if not slug:
              slug = f"insight-{issue_no}"
          slug = slug[:120].strip("-")

          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          # Jekyll이 방금 생성된 글을 미래 글로 판단하지 않도록 3분 여유를 둡니다.
          publish_time = now - datetime.timedelta(minutes=3)
          today=publish_time.strftime("%Y-%m-%d")
          target=pathlib.Path("_posts")/f"{today}-{slug}.md"
          target.parent.mkdir(exist_ok=True)

          def q(s):
              return '"' + s.replace("\\","\\\\").replace('"','\\"').replace("\n"," ") + '"'

          lines=[
              "---",
              "layout: post",
              f"title: {q(title)}",
              f"seo_title: {q(seo_title or title + ' | id clinic')}",
              f"description: {q(description)}",
              f"category: {q(category)}",
              f"date: {publish_time.strftime('%Y-%m-%d %H:%M:%S')} +0900",
              *([f"thumbnail: {q(thumbnail)}"] if thumbnail else []),
              *([f"thumbnail_link: {q(thumbnail_link)}"] if thumbnail_link else []),
              *([f"promo_title: {q(promo_title)}"] if promo_title else []),
              *([f"promo_price: {q(promo_price)}"] if promo_price else []),
              *([f"promo_link: {q(promo_link)}"] if promo_link else []),
              *([f"consult_link: {q(consult_link)}"] if consult_link else []),
              *([f"phone: {q(phone)}"] if phone else []),
              *([f"booking_link: {q(booking_link)}"] if booking_link else []),
              "---",
              "",
              content,
              ""
          ]
          target.write_text("\n".join(lines),encoding="utf-8")
          pathlib.Path("/tmp/generated_slug").write_text(slug,encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "FINE COLUMN Bot"
          git config user.email "actions@github.com"
          git add _posts
          git commit -m "Publish insight from issue #${{ github.event.issue.number }}"
          git push origin main

      - name: Pull published commit
        run: |
          git pull --rebase origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment published URL and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const slug = fs.readFileSync('/tmp/generated_slug', 'utf8').trim();
            const url = 'https://hwsr6028-source.github.io/insight/' + slug + '/';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ 인사이트 발행이 완료되었습니다.\n\n' + url
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
