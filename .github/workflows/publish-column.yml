name: Publish FINE COLUMN from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[칼럼]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create insight markdown
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import os, re, pathlib, datetime

          body = os.environ["ISSUE_BODY"]
          issue_no = os.environ["ISSUE_NUMBER"]

          def section(name):
              m = re.search(rf"### {re.escape(name)}\s*\n\s*(.*?)(?=\n### |\Z)", body, re.S)
              if not m:
                  return ""
              v = m.group(1).strip()
              return "" if v == "_No response_" else v

          title = section("제목")
          seo_title = section("SEO 제목")
          description = section("검색 설명")
          category = section("카테고리")
          content = section("본문")

          if not title or not description or not category or not content:
              raise SystemExit("필수 입력값을 찾지 못했습니다.")

          brand_map = {
              "아이리쥬란":"eye-rejuran","리쥬란":"rejuran","울쎄라피 프라임":"ultherapy-prime",
              "울쎄라프라임":"ultherapy-prime","울쎄라":"ulthera","써마지 FLX":"thermage-flx",
              "써마지":"thermage","온다":"onda","피코토닝":"pico-toning","피코슈어":"picosure",
              "쥬베룩":"juvelook","리투오":"re2o","레티젠":"letigen","보톡스":"tox",
              "필러":"filler","스킨부스터":"skin-booster","여드름":"acne","리프팅":"lifting",
              "색소":"pigmentation","기미":"melasma","제모":"hair-removal"
          }

          CHO=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"]
          JUNG=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"]
          JONG=["","k","k","ks","n","nj","nh","t","l","lk","lm","lb","ls","lt","lp","lh","m","p","ps","t","t","ng","t","t","k","t","p","h"]

          def romanize_char(ch):
              code=ord(ch)
              if 0xAC00 <= code <= 0xD7A3:
                  n=code-0xAC00
                  return CHO[n//588]+JUNG[(n%588)//28]+JONG[n%28]
              if ch.isascii() and ch.isalnum():
                  return ch.lower()
              return "-"

          work=title
          tokens={}
          for ko in sorted(brand_map,key=len,reverse=True):
              if ko in work:
                  token=f"zztoken{len(tokens)}zz"
                  tokens[token]=brand_map[ko]
                  work=work.replace(ko,token)

          raw="".join(romanize_char(ch) for ch in work)
          for token,value in tokens.items():
              raw=raw.replace(token,value)

          slug=re.sub(r"[^a-z0-9]+","-",raw.lower())
          slug=re.sub(r"-+","-",slug).strip("-")
          if not slug:
              slug=f"insight-{issue_no}"
          slug=slug[:90].strip("-")

          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          today=now.strftime("%Y-%m-%d")
          target=pathlib.Path("_posts")/f"{today}-{slug}.md"
          target.parent.mkdir(exist_ok=True)

          def q(s):
              return '"' + s.replace("\\","\\\\").replace('"','\\"').replace("\n"," ") + '"'

          lines=[
              "---",
              "layout: post",
              f"title: {q(title)}",
              f"seo_title: {q(seo_title or title + ' | id clinic')}",
              f"description: {q(description)}",
              f"category: {q(category)}",
              f"date: {today} {now.strftime('%H:%M:%S')} +0900",
              "---",
              "",
              content,
              ""
          ]
          target.write_text("\n".join(lines),encoding="utf-8")
          pathlib.Path("/tmp/generated_slug").write_text(slug,encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "FINE COLUMN Bot"
          git config user.email "actions@github.com"
          git add _posts
          git commit -m "Publish insight from issue #${{ github.event.issue.number }}"
          git push origin main

      - name: Pull published commit
        run: |
          git pull --rebase origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment published URL and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const slug = fs.readFileSync('/tmp/generated_slug', 'utf8').trim();
            const url = 'https://hwsr6028-source.github.io/insight/' + slug + '/';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ 인사이트 발행이 완료되었습니다.\n\n' + url
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
