<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} | id clinic{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.layout == 'post' %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"datePublished":"{{ page.date | date_to_xmlschema }}","dateModified":"{{ page.modified | default: page.date | date_to_xmlschema }}","author":{"@type":"Organization","name":"id clinic"},"publisher":{"@type":"Organization","name":"id clinic"},"mainEntityOfPage":"{{ page.url | absolute_url }}"}</script>
{% endif %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>{% include header.html %}{{ content }}{% include footer.html %}</body>
</html>
